<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gael Status - Wind UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animación suave del fondo */
        @keyframes mesh {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .animate-mesh {
            background: linear-gradient(-45deg, #0f172a, #1e293b, #334155, #020617);
            background-size: 400% 400%;
            animation: mesh 15s ease infinite;
        }

        /* Animación de rotación lenta para el anillo exterior */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spin-slow {
            animation: spin-slow 8s linear infinite;
        }
    </style>
</head>
<body class="animate-mesh min-h-screen flex items-center justify-center p-4">

    <div class="relative group w-full max-w-sm">
        <div class="absolute -inset-0.5 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
        
        <div class="relative bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
            <header class="text-center mb-8">
                <h1 class="text-2xl font-bold tracking-tight text-white italic">
                    Gael is <span class="text-cyan-400">busy</span>
                </h1>
                <p class="text-slate-400 text-sm mt-1">Focus mode enabled</p>
            </header>

            <div class="flex flex-col items-center justify-center">
                <div class="relative w-40 h-40">
                    <svg class="w-full h-full spin-slow" viewBox="0 0 100 100">
                        <circle 
                            class="text-slate-800 stroke-current" 
                            stroke-width="8" 
                            cx="50" cy="50" r="40" fill="transparent"
                        ></circle>
                        <circle 
                            class="text-cyan-500 stroke-current" 
                            stroke-width="8" 
                            stroke-linecap="round" 
                            cx="50" cy="50" r="40" fill="transparent"
                            stroke-dasharray="251.2"
                            stroke-dashoffset="62.8"
                        ></circle>
                    </svg>
                    
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span class="text-3xl font-extrabold text-white">75%</span>
                        <span class="text-[10px] uppercase tracking-widest text-cyan-500 font-semibold">Done</span>
                    </div>
                </div>
            </div>

            <footer class="mt-8">
                <div class="flex justify-between items-center text-xs text-slate-500 mb-2">
                    <span>Task progress</span>
                    <span>75/100</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-1.5">
                    <div class="bg-cyan-500 h-1.5 rounded-full shadow-[0_0_10px_rgba(6,182,212,0.5)]" style="width: 75%"></div>
                </div>
                <p class="text-center text-[11px] text-slate-500 mt-6 animate-pulse">
                    Please do not disturb • Coding in progress
                </p>
            </footer>
        </div>
    </div>

</body>
</html>
